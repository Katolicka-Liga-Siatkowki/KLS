name: Import KLS source
on:
  push:
    paths: [".github/workflows/import-source.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested roster visibility controls
        run: |
          test -d kls
          echo "4dcd0107ccb5aa3d17754ff59ccadcb392950f846a7a1763328e886a27476c21  kls-roster-update.tar.gz" | sha256sum --check
          tar -xzf kls-roster-update.tar.gz
          git config user.name "KLS source import"
          git config user.email "katolickaligasiatkowki@gmail.com"
          git add kls
          git diff --cached --quiet || git commit -m "Add global and per-team roster visibility controls"
          git push
